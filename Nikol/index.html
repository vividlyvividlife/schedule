<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Расписание Николь</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="header">
  <div>
    <h1>Расписание Николь</h1>
    <div class="sub">2 «А» · СОШ №12 · 2026–2027</div>
    <div class="date" id="dateDisplay" data-clock></div>
    <a href="../" style="font-size:12px;color:var(--accent);text-decoration:none;margin-top:4px;display:inline-block;">← Основное расписание</a>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="Тёмная тема">☀</button>
</div>

<div class="toggles">
  <div class="toggle-item">
    <label class="toggle">
      <input type="checkbox" id="personalToggle" onchange="onToggle()">
      <span class="toggle-slider"></span>
    </label>
    <label for="personalToggle">Занятия</label>
  </div>
  <div class="toggle-item">
    <label class="toggle">
      <input type="checkbox" id="extendedToggle" onchange="onToggle()">
      <span class="toggle-slider"></span>
    </label>
    <label for="extendedToggle">Продлёнка</label>
  </div>
</div>

<div class="status" id="status"></div>
<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
<div class="day-tabs" id="dayTabs"></div>
<div class="day-content" id="dayContent"></div>

<div class="export-bar" id="exportBar">
  <button class="export-btn" onclick="exportNikolSchool()">📄 Уроки JSON</button>
  <button class="export-btn" onclick="exportNikolPersonal()">🤸 Занятия JSON</button>
  <button class="export-btn" onclick="exportNikolExtended()">🎒 Продлёнка JSON</button>
</div>

<script src="../engines.js"></script>
<script src="nikol.js"></script>
</body>
</html>
