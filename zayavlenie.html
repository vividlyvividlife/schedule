<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявление директору на освобождение от уроков</title>
<link rel="stylesheet" href="style.css">
<style>
  .form-page { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
  .form-page h2 { font-size: 20px; margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .form-group input, .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
    transition: border-color 0.2s;
    outline: none;
  }
  .form-group input:focus,   .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
    transition: border-color 0.2s;
    outline: none;
    cursor: pointer;
  }
  .form-group select:focus { border-color: var(--accent); }
  .dark .form-group select { background: var(--card); color: var(--text); }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  .datepicker-wrap { position: relative; }
  .datepicker-wrap input { cursor: pointer; }
  .datepicker-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 100;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    padding: 12px;
    min-width: 260px;
  }
  .datepicker-dropdown.open { display: block; }
  .dp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .dp-header button {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: var(--text);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .dp-header button:hover { background: var(--active-bg); }
  .dp-header .dp-title { font-size: 14px; font-weight: 600; }
  .dp-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 4px; }
  .dp-weekdays span { font-size: 11px; color: var(--muted); font-weight: 600; padding: 4px 0; }
  .dp-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dp-day {
    text-align: center;
    padding: 7px 0;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text);
    transition: background 0.15s;
  }
  .dp-day:hover { background: var(--active-bg); }
  .dp-day.today { font-weight: 700; color: var(--accent); }
  .dp-day.selected { background: var(--accent); color: #fff; font-weight: 600; }
  .dp-day.other-month { color: var(--muted); opacity: 0.4; }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
    text-align: center;
  }
  .btn:hover { background: var(--active-bg); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { opacity: 0.9; }

  .preview-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.5);
    overflow-y: auto;
    padding: 20px;
  }
  .preview-overlay.open { display: flex; justify-content: center; align-items: flex-start; }
  .preview-paper {
    background: #fff;
    color: #000;
    max-width: 210mm;
    width: 100%;
    padding: 20mm 25mm;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    font-size: 14px;
    line-height: 1.8;
    margin: 20px auto;
    position: relative;
  }
  .preview-paper .close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #f0f0f0;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .preview-paper .close-btn:hover { background: #e0e0e0; }
  .preview-paper .right { text-align: right; }
  .preview-paper .center { text-align: center; }
  .preview-paper .indent { text-indent: 32px; }
  .preview-paper .underline { border-bottom: 1px solid #000; display: inline-block; min-width: 180px; }
  .preview-paper .underline-short { border-bottom: 1px solid #000; display: inline-block; min-width: 100px; }
  .preview-paper .signature-block { display: flex; justify-content: space-between; margin-top: 40px; }
  .preview-paper .sig-date { }
  .preview-paper .sig-place { text-align: right; }
  .preview-paper .sig-label { font-size: 12px; color: #888; margin-top: 2px; }

  @media print {
    body * { visibility: hidden; }
    .preview-paper, .preview-paper * { visibility: visible; }
    .preview-paper { position: absolute; left: 0; top: 0; box-shadow: none; padding: 20mm 25mm; width: 210mm; }
    .close-btn, .print-btn, .back-btn { display: none !important; }
  }
</style>
</head>
<body>

<div class="form-page" id="formPage">
  <div style="margin-bottom:16px;">
    <a href="index.html" style="font-size:14px;color:var(--accent);text-decoration:none;">← Расписание</a>
  </div>
  <h2>Заявление директору на освобождение от уроков</h2>

  <div class="form-group">
    <label>ФИО родителя / законного представителя</label>
    <input type="text" id="parentName" placeholder="Иванова Мария Петровна">
  </div>

  <div class="form-group">
    <label>Адрес</label>
    <input type="text" id="address" placeholder="г.Гомель, ул. Космонавтов, 64">
  </div>

  <div class="form-group">
    <label>Телефон</label>
    <input type="text" id="phone" placeholder="+375291234567">
  </div>

  <div class="form-group">
    <label>ФИО ребёнка</label>
    <input type="text" id="childName" placeholder="Иванова О. Т.">
  </div>

  <div class="form-group">
    <label>Класс</label>
    <input type="text" id="className" placeholder='2 "А"'>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Дата начала отсутствия</label>
      <div class="datepicker-wrap">
        <input type="text" id="dateFrom" placeholder="дд.мм.гггг" readonly>
        <div class="datepicker-dropdown" id="dpFrom"></div>
      </div>
    </div>
    <div class="form-group">
      <label>Дата окончания</label>
      <div class="datepicker-wrap">
        <input type="text" id="dateTo" placeholder="дд.мм.гггг" readonly>
        <div class="datepicker-dropdown" id="dpTo"></div>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>Причина отсутствия</label>
    <select id="reasonSelect" onchange="onReasonChange()">
      <option value="">— Выберите причину —</option>
      <option value="Болезнь ребенка" data-short="болезнь ребенка" data-gen="болезнью ребенка">Болезнь ребенка (не более 3 дней, без справки)</option>
      <option value="Пребывание на домашнем режиме" data-short="пребывание на домашнем режиме по рекомендации врача" data-gen="пребыванием на домашнем режиме по рекомендации врача">Пребывание на домашнем режиме по рекомендации врача</option>
      <option value="Отпуск родителей" data-short="отпуск родителей" data-gen="отпуском родителей (законных представителей)">Отпуск родителей (законных представителей)</option>
      <option value="Непредвиденные семейные обстоятельства" data-short="непредвиденные семейные обстоятельства" data-gen="непредвиденными семейными обстоятельствами (переезд, болезнь близких родственников)">Непредвиденные семейные обстоятельства (переезд, болезнь близких родственников)</option>
      <option value="Служебная командировка родителей" data-short="служебная командировка родителей" data-gen="служебной командировкой родителей">Служебная командировка родителей</option>
      <option value="Выходные дни родителей" data-short="выходные дни родителей" data-gen="выходными днями родителей (в т.ч. при сменном или гибком графике)">Выходные дни родителей (в т.ч. при сменном или гибком графике)</option>
      <option value="custom">Другое (указать свою причину)...</option>
    </select>
    <textarea id="reason" placeholder="Укажите причину" style="margin-top:8px;"></textarea>
  </div>

  <div class="form-group">
    <label>Дата написания заявления</label>
    <div class="datepicker-wrap">
      <input type="text" id="dateWrite" placeholder="дд.мм.гггг" readonly>
      <div class="datepicker-dropdown" id="dpWrite"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="showPreview()">Предварительный просмотр</button>
    <button class="btn" onclick="saveForm()">Сохранить</button>
    <button class="btn" onclick="resetForm()">Сбросить</button>
  </div>
</div>

<div class="preview-overlay" id="previewOverlay">
  <div class="preview-paper" id="previewPaper">
    <button class="close-btn" onclick="closePreview()">✕</button>
    <div id="previewContent"></div>
    <div class="btn-row" style="margin-top:24px;">
      <button class="btn print-btn" onclick="printPreview()">Печать</button>
      <button class="btn back-btn" onclick="closePreview()">Назад к редактированию</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "zayavlenie";
let activePicker = null;

function onReasonChange() {
  const select = document.getElementById("reasonSelect");
  const textarea = document.getElementById("reason");
  if (select.value === "custom") {
    textarea.value = "";
    textarea.focus();
  } else {
    textarea.value = select.options[select.selectedIndex].getAttribute("data-short") || "";
  }
}

function loadForm() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data) {
      document.getElementById("parentName").value = data.parentName || "";
      document.getElementById("address").value = data.address || "";
      document.getElementById("phone").value = data.phone || "";
      document.getElementById("childName").value = data.childName || "";
      document.getElementById("className").value = data.className || "";
      document.getElementById("dateFrom").value = data.dateFrom || "";
      document.getElementById("dateTo").value = data.dateTo || "";
      document.getElementById("reason").value = data.reason || "";
      const reasonSelect = document.getElementById("reasonSelect");
      let matched = false;
      for (const opt of reasonSelect.options) {
        if (opt.value === data.reason || opt.getAttribute("data-short") === data.reason) {
          reasonSelect.value = opt.value;
          matched = true;
          break;
        }
      }
      if (!matched && data.reason) {
        reasonSelect.value = "custom";
        document.getElementById("reason").style.display = "block";
      }
      document.getElementById("dateWrite").value = data.dateWrite || "";
    }
  } catch (e) {}
}

function saveForm() {
  const data = {
    parentName: document.getElementById("parentName").value,
    address: document.getElementById("address").value,
    phone: document.getElementById("phone").value,
    childName: document.getElementById("childName").value,
    className: document.getElementById("className").value,
    dateFrom: document.getElementById("dateFrom").value,
    dateTo: document.getElementById("dateTo").value,
    reason: document.getElementById("reason").value,
    dateWrite: document.getElementById("dateWrite").value,
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function resetForm() {
  if (!confirm("Сбросить все данные?")) return;
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll("input, textarea").forEach(el => { el.value = ""; });
  document.getElementById("reasonSelect").value = "";
}

function formatDate(d) {
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yyyy = d.getFullYear();
  return `${dd}.${mm}.${yyyy}`;
}

function parseFormattedDate(str) {
  if (!str) return null;
  const [dd, mm, yyyy] = str.split(".").map(Number);
  return new Date(yyyy, mm - 1, dd);
}

function createDatePicker(containerId, inputId) {
  const container = document.getElementById(containerId);
  const input = document.getElementById(inputId);
  let currentMonth = new Date().getMonth();
  let currentYear = new Date().getFullYear();

  function render() {
    const today = new Date();
    const selected = parseFormattedDate(input.value);
    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay = new Date(currentYear, currentMonth + 1, 0);
    const startDow = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

    const monthNames = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
    const weekDays = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

    let html = `
      <div class="dp-header">
        <button onclick="event.stopPropagation();dpNav('${containerId}',-1)">‹</button>
        <span class="dp-title">${monthNames[currentMonth]} ${currentYear}</span>
        <button onclick="event.stopPropagation();dpNav('${containerId}',1)">›</button>
      </div>
      <div class="dp-weekdays">${weekDays.map(d => `<span>${d}</span>`).join("")}</div>
      <div class="dp-days">`;

    for (let i = 0; i < startDow; i++) {
      const prevDate = new Date(currentYear, currentMonth, -startDow + i + 1);
      html += `<button class="dp-day other-month" onclick="event.stopPropagation();dpPick('${containerId}','${inputId}','${formatDate(prevDate)}')">${prevDate.getDate()}</button>`;
    }

    for (let d = 1; d <= lastDay.getDate(); d++) {
      const date = new Date(currentYear, currentMonth, d);
      const isToday = date.toDateString() === today.toDateString();
      const isSelected = selected && date.toDateString() === selected.toDateString();
      const cls = `dp-day${isToday ? " today" : ""}${isSelected ? " selected" : ""}`;
      html += `<button class="${cls}" onclick="event.stopPropagation();dpPick('${containerId}','${inputId}','${formatDate(date)}')">${d}</button>`;
    }

    const totalCells = startDow + lastDay.getDate();
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= remaining; i++) {
      const nextDate = new Date(currentYear, currentMonth + 1, i);
      html += `<button class="dp-day other-month" onclick="event.stopPropagation();dpPick('${containerId}','${inputId}','${formatDate(nextDate)}')">${i}</button>`;
    }

    html += `</div>`;
    container.innerHTML = html;
  }

  container._render = render;
  container._month = () => currentMonth;
  container._year = () => currentYear;
  container._setMonth = (m, y) => { currentMonth = m; currentYear = y; };

  render();
}

function dpNav(containerId, dir) {
  const container = document.getElementById(containerId);
  let m = container._month() + dir;
  let y = container._year();
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  container._setMonth(m, y);
  container._render();
}

function dpPick(containerId, inputId, dateStr) {
  document.getElementById(inputId).value = dateStr;
  document.getElementById(containerId).classList.remove("open");
  activePicker = null;
  saveForm();
}

createDatePicker("dpFrom", "dateFrom");
createDatePicker("dpTo", "dateTo");
createDatePicker("dpWrite", "dateWrite");

document.addEventListener("click", (e) => {
  if (!activePicker) return;
  const wrap = activePicker.closest(".datepicker-wrap");
  if (wrap && wrap.contains(e.target)) return;
  activePicker.classList.remove("open");
  activePicker = null;
});

document.querySelectorAll(".datepicker-wrap input").forEach(input => {
  input.addEventListener("click", () => {
    const dropdown = input.nextElementSibling;
    if (activePicker && activePicker !== dropdown) {
      activePicker.classList.remove("open");
    }
    dropdown.classList.toggle("open");
    activePicker = dropdown.classList.contains("open") ? dropdown : null;

    const selected = parseFormattedDate(input.value);
    if (selected) {
      const container = dropdown;
      container._setMonth(selected.getMonth(), selected.getFullYear());
      container._render();
    }
  });
});

function showPreview() {
  saveForm();
  const d = {
    parentName: document.getElementById("parentName").value.trim(),
    address: document.getElementById("address").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    childName: document.getElementById("childName").value.trim(),
    className: document.getElementById("className").value.trim(),
    dateFrom: document.getElementById("dateFrom").value.trim(),
    dateTo: document.getElementById("dateTo").value.trim(),
    reason: document.getElementById("reason").value.trim(),
    dateWrite: document.getElementById("dateWrite").value.trim(),
  };

  const reasonSelect = document.getElementById("reasonSelect");
  const selectedOpt = reasonSelect.options[reasonSelect.selectedIndex];
  d.reasonGen = selectedOpt.getAttribute("data-gen") || d.reason;

  const parentShort = d.parentName.split(" ").map((w, i) => i === 0 ? w : w[0] + ".").join(" ");
  const phoneFormatted = d.phone ? d.phone.replace(/(\+375)(\d{2})(\d{3})(\d{2})(\d{2})/, "$1 $2 $3 $4 $5") : "+375 ___-__-__";

  const html = `
    <div style="font-size:13px;line-height:1.8;">

      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div style="width:320px;">
          <div style="font-style:italic;font-weight:700;">Заявление</div>
          <div style="margin-top:6px;">_______№_______</div>
        </div>
        <div style="width:320px;text-align:left;margin-left:auto;">
          <div>Директору государственного</div>
          <div>учреждения образования</div>
          <div>«Средняя школа №12 г. Гомеля»</div>
          <div>Антоненко В. В.</div>
          <div style="margin-top:8px;">${d.parentName || ""}</div>
          <div style="margin-top:4px;">прож. по адресу: ${d.address || ""}</div>
          <div style="margin-top:4px;">
            ${d.phone ? d.phone.replace(/(\+375)(\d{2})(\d{3})(\d{2})(\d{2})/, "$1 $2 $3 $4 $5") : "+375 ___-__-__"}
          </div>
        </div>
      </div>

      <div style="margin-top:60px;text-indent:30px;">
        Прошу разрешить отсутствовать на учебных занятиях моему ребенку
        ${d.childName || ""},
        учащейся(гося) ${d.className || ""} класса, с
        ${d.dateFrom || ""}
        по
        ${d.dateTo || ""}
        в связи
        ${d.reasonGen || ""}.
      </div>

      <div style="margin-top:16px;text-indent:30px;">
        На время отсутствия моего ребенка ответственность за сохранность жизни и его здоровья возлагаю на себя.
      </div>

      <div style="margin-top:16px;text-indent:30px;">
        Пропущенный материал обязуемся отработать самостоятельно.
      </div>

      <div style="margin-top:50px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div>${d.dateWrite || "____.____.2026"}</div>
        <div style="text-align:center;">
          <span style="display:inline-block;min-width:200px;border-bottom:1px solid #000;"></span>
        </div>
        <div style="text-align:center;">
          <span>ФИО</span>
          <span style="display:inline-block;min-width:160px;border-bottom:1px solid #000;">${parentShort || ""}</span>
        </div>
      </div>
    </div>
  `;

  document.getElementById("previewContent").innerHTML = html;
  document.getElementById("previewOverlay").classList.add("open");
}

function closePreview() {
  document.getElementById("previewOverlay").classList.remove("open");
}

function printPreview() {
  window.print();
}

loadForm();
</script>
</body>
</html>
