<button class="theme-btn" onclick="toggleTheme()" title="Тёмная тема" style="position:fixed;top:8px;right:8px;z-index:100;">☀</button>

<div class="toggle-row">
  <label class="toggle">
    <input type="checkbox" id="extendedToggle" onchange="toggleExtended()">
    <span class="toggle-slider"></span>
  </label>
  <label for="extendedToggle">Группа продлённого дня</label>
  <span class="extended-label" id="extendedLabel"></span>
</div>

<div class="status" id="status"></div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="countdowns" id="countdowns"></div>

<div class="day-tabs" id="dayTabs"></div>

<div class="day-content" id="dayContent"></div>

<div class="export-bar" id="exportBar">
  <button class="export-btn" onclick="exportSchool()">📄 Уроки JSON</button>
  <button class="export-btn" onclick="exportExtended()">🎒 Продлёнка JSON</button>
</div>
