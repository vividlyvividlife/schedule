<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Расписание 2А · 2026–2027</title>
<meta property="og:title" content="Расписание 2А · 2026–2027">
<meta property="og:description" content="Расписание уроков 2 «А» класс · ауд. 1-3 · Беларусь">
<meta property="og:type" content="website">
<meta property="og:image" content="https://vividlyvividlife.github.io/schedule/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Расписание 2А · 2026–2027">
<meta name="twitter:description" content="Расписание уроков 2 «А» класс · ауд. 1-3">
<meta name="twitter:image" content="https://vividlyvividlife.github.io/schedule/og-image.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div>
    <h1>Расписание 2026–2027</h1>
    <div class="sub">2 «А» · ауд. 1-3</div>
    <div class="date" id="dateDisplay" data-clock></div>
    <a href="zayavlenie.html" style="font-size:12px;color:var(--accent);text-decoration:none;margin-top:4px;display:inline-block;">Заявление директору на освобождение от уроков →</a>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="Тёмная тема">☀</button>
</div>

<div class="toggles" id="togglesContainer"></div>

<div class="status" id="status"></div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="countdowns" id="countdowns"></div>

<div class="day-tabs" id="dayTabs"></div>

<div class="day-content" id="dayContent"></div>

<div class="export-bar" id="exportBar">
  <button class="export-btn" onclick="exportSchool()">📄 Уроки JSON</button>
  <button class="export-btn" onclick="exportPersonal()">🤸 Занятия JSON</button>
  <button class="export-btn" onclick="exportExtended()">🎒 Продлёнка JSON</button>
</div>

<div class="edit-bar" id="editBar">
  <button class="edit-toggle" id="editToggle" onclick="toggleEditMode()">✏️ Режим редактирования</button>
  <button class="add-btn" id="addBtn" onclick="showAddModal()" style="display:none;">+ Добавить урок</button>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Редактировать</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <label class="modal-label">День
        <select class="modal-input" id="modalDay"></select>
      </label>
      <label class="modal-label">Номер урока
        <input class="modal-input" id="modalNum" type="number" min="1" max="11">
      </label>
      <label class="modal-label">Предмет
        <input class="modal-input" id="modalSubj" placeholder="Математика">
      </label>
      <label class="modal-label">Время
        <input class="modal-input" id="modalTime" placeholder="08:30–09:15">
      </label>
      <label class="modal-label">Кабинет
        <input class="modal-input" id="modalRoom" placeholder="ауд. 1-3">
      </label>
      <label class="modal-label">Тип
        <select class="modal-input" id="modalType">
          <option value="school">Урок</option>
          <option value="personal">Занятие</option>
          <option value="extended">Продлёнка</option>
        </select>
      </label>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="modal-btn modal-btn-delete" id="modalDeleteBtn" onclick="deleteFromModal()" style="display:none;background:#d45555;color:#fff;">Удалить</button>
      <button class="modal-btn modal-btn-save" onclick="saveModal()">Сохранить</button>
    </div>
  </div>
</div>

<script src="engines.js"></script>
<script src="script.js"></script>
</body>
</html>
