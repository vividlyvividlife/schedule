<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Расписание — 2 «А»</title>
<style>
  :root {
    --bg: #f5f5f0;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #8a8a9a;
    --accent: #5b6abf;
    --line: #e8e8e3;
    --active-bg: #f0f1f8;
    --shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .dark {
    --bg: #111118;
    --card: #1a1a24;
    --text: #e8e8ed;
    --muted: #8888a0;
    --accent: #7b8ad4;
    --line: #2a2a35;
    --active-bg: #1e2236;
    --shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    overflow-x: hidden;
  }

  .header {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .theme-btn {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 40px; height: 40px;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    color: var(--text);
    flex-shrink: 0;
  }
  .theme-btn:hover { background: var(--active-bg); }

  .status {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .status .highlight { color: var(--accent); font-weight: 600; }

  .day-tabs {
    display: flex;
    gap: 6px;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .day-tab.active {
    color: #fff;
  }
  .day-tab[data-day="0"].active { background: #5b7abf; border-color: #5b7abf; }
  .day-tab[data-day="1"].active { background: #7b6abf; border-color: #7b6abf; }
  .day-tab[data-day="2"].active { background: #9b6abf; border-color: #9b6abf; }
  .day-tab[data-day="3"].active { background: #c46b8a; border-color: #c46b8a; }
  .day-tab[data-day="4"].active { background: #5aaf8a; border-color: #5aaf8a; }
  .day-tab[data-day="5"].active { background: #e8a84c; border-color: #e8a84c; }
  .day-tab[data-day="6"].active { background: #d45555; border-color: #d45555; }
  .day-tab.today { border-color: var(--accent); }

  .day-content {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px 32px;
    touch-action: pan-y;
  }
  .day-panel { display: none; }
  .day-panel.active { display: block; }

  .lesson {
    display: flex;
    align-items: stretch;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background 0.2s, transform 0.15s;
  }
  .lesson:active { transform: scale(0.98); }
  .lesson.current {
    background: var(--active-bg);
    border-left: 3px solid var(--accent);
  }
  .lesson.past { opacity: 0.5; }
  .lesson-body {
    flex: 1;
    padding: 12px 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .lesson-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    min-width: 20px;
    padding-top: 1px;
  }
  .lesson-info { flex: 1; }
  .lesson-time { font-size: 12px; color: var(--muted); }
  .lesson-subject { font-size: 15px; font-weight: 500; }
  .lesson-countdown {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 2px;
  }

  .weekend-msg {
    text-align: center;
    padding: 32px 20px;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.6;
  }
  .weekend-msg .emoji {
    font-size: 48px;
    display: block;
    margin-bottom: 12px;
  }
  .weekend-msg .sub {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 8px;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .animate-float .emoji { animation: float 3s ease-in-out infinite; }
  .animate-pulse .emoji { animation: pulse 2s ease-in-out infinite; }

  @media (min-width: 768px) {
    .day-tabs { display: none; }
    .day-content { padding: 0 24px 40px; }
    .day-panel { display: block !important; }
    .diary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }
    .diary-day { margin-bottom: 28px; }
    .diary-day-name {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 5px 14px;
      border-radius: 5px;
      display: inline-block;
      margin-bottom: 12px;
      color: #fff;
    }
    .diary-day:nth-child(1) .diary-day-name { background: #5b7abf; }
    .diary-day:nth-child(2) .diary-day-name { background: #7b6abf; }
    .diary-day:nth-child(3) .diary-day-name { background: #9b6abf; }
    .diary-day:nth-child(4) .diary-day-name { background: #c46b8a; }
    .diary-day:nth-child(5) .diary-day-name { background: #5aaf8a; }
    .diary-day:nth-child(6) .diary-day-name { background: #e8a84c; }
    .diary-day:nth-child(7) .diary-day-name { background: #d45555; }
    .empty-day {
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
    }
  }

  .progress-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px 20px;
  }
  .progress-bar {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.5s;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Расписание 2026–2027</h1>
    <div class="sub">2 «А» · ауд. 1-3</div>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="Тёмная тема">☀</button>
</div>

<div class="status" id="status"></div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="day-tabs" id="dayTabs"></div>

<div class="day-content" id="dayContent"></div>

<script>
const SAT_MESSAGES = [
  { emoji: "🎉", text: "Наконец-то выходной!", anim: "float" },
  { emoji: "🍕", text: "Суббота! Можно ничего не делать", anim: "" },
  { emoji: "🎮", text: "Свободный день — играем!", anim: "" },

  { emoji: "🧸", text: "Суббота — день приключений", anim: "" },
  { emoji: "🍦", text: "Выходной = мороженое", anim: "" },
  { emoji: "📚", text: "Можно почитать что хочется!", anim: "" },
  { emoji: "⚽", text: "Суббота — лучший день для игр", anim: "float" },
  { emoji: "🎨", text: "Рисуем, лепим, творим!", anim: "" },
  { emoji: "🌳", text: "Выходной — гуляем на свежем воздухе", anim: "" },
  { emoji: "😴", text: "Спим сколько хочется!", anim: "" },
  { emoji: "🎪", text: "Суббота — как маленький праздник", anim: "pulse" },
  { emoji: "🐕", text: "Выходной — время для любимых дел", anim: "" },
  { emoji: "🧹", text: "Суббота: сначала убираемся, потом веселимся", anim: "" },
  { emoji: "🎯", text: "День для своих планов!", anim: "" },
  { emoji: "🌈", text: "Выходной — мир прекрасен", anim: "float" },
  { emoji: "🍳", text: "Субботнее утро = завтрак от шефа", anim: "" },
  { emoji: "🚴", text: "Катаемся, бегаем, прыгаем!", anim: "" },
  { emoji: "🎵", text: "Суббота — день музыки и танцев", anim: "pulse" },
  { emoji: "🧩", text: "Собираем пазлы и играем в настолки", anim: "" },

const SUN_MESSAGES = [
  { emoji: "😱", text: "Ой, завтра понедельник...", anim: "" },
  { emoji: "😩", text: "Почему воскресенье такое короткое?", anim: "" },
  { emoji: "😅", text: "Завтра в школу... но ещё есть время!", anim: "" },
  { emoji: "🤢", text: "О нет, завтра снова вставать рано!", anim: "" },
  { emoji: "😤", text: "Воскресенье — последний шанс отдохнуть!", anim: "" },
  { emoji: "😈", text: "Завтра понедельник, а я ещё не готов", anim: "" },
  { emoji: "🙈", text: "Домашку сделали? ...я тоже нет", anim: "" },
  { emoji: "😬", text: "Завтра 8:00... это рано...", anim: "" },
  { emoji: "🤞", text: "Надеюсь, завтра будет легко", anim: "" },
  { emoji: "💫", text: "Воскресенье — день восстановления", anim: "float" },
  { emoji: "☕", text: "Наслаждаемся последним днём каникул", anim: "" },
  { emoji: "📋", text: "Проверяем рюкзак на завтра!", anim: "" },
  { emoji: "😅", text: "Дышим... завтра снова в бой", anim: "" },
  { emoji: "🌙", text: "Вечер воскресенья — самое грустное время", anim: "" },
  { emoji: "💪", text: "Ничего, справимся и завтра!", anim: "pulse" },
  { emoji: "🫣", text: "Смотрю на будильник... 6:30... кошмар", anim: "" },
  { emoji: "🎈", text: "Но сегодня ещёoliday!", anim: "" },
  { emoji: "🫡", text: "Готовимся к новой неделе!", anim: "" },
  { emoji: "😴", text: "Ложимся рано... или не ложимся?", anim: "" },
  { emoji: "🤷", text: "Завтра понедельник. Бывает.", anim: "" },
];

const SCHEDULE = [
  {
    name: "Понедельник", short: "ПН",
    lessons: [
      { n: 1, time: "8:00–8:45", subj: "Белорусская литература" },
      { n: 2, time: "9:00–9:45", subj: "Белорусский язык" },
      { n: 3, time: "10:00–10:45", subj: "ФКиЗ" },
      { n: 4, time: "10:55–11:40", subj: "Русская литература" },
      { n: 5, time: "11:55–12:40", subj: "Факультатив" },
    ]
  },
  {
    name: "Вторник", short: "ВТ",
    lessons: [
      { n: 1, time: "8:00–8:45", subj: "Русская литература" },
      { n: 2, time: "9:00–9:45", subj: "Математика" },
      { n: 3, time: "10:00–10:45", subj: "Русский язык" },
      { n: 4, time: "10:55–11:40", subj: "Трудовое обучение" },
    ]
  },
  {
    name: "Среда", short: "СР",
    lessons: [
      { n: 1, time: "8:00–8:45", subj: "ФКиЗ" },
      { n: 2, time: "9:00–9:45", subj: "Математика" },
      { n: 3, time: "10:00–10:45", subj: "Белорусский язык" },
      { n: 4, time: "10:55–11:40", subj: "Белорусская литература" },
    ]
  },
  {
    name: "Четверг", short: "ЧТ",
    lessons: [
      { n: 1, time: "8:00–8:45", subj: "ОБЖ" },
      { n: 2, time: "9:00–9:45", subj: "Математика" },
      { n: 3, time: "10:00–10:45", subj: "Музыка" },
      { n: 4, time: "10:55–11:40", subj: "Русский язык" },
      { n: 5, time: "11:55–12:40", subj: "ФКиЗ" },
    ]
  },
  {
    name: "Пятница", short: "ПТ",
    lessons: [
      { n: 1, time: "8:00–8:45", subj: "Человек и мир" },
      { n: 2, time: "9:00–9:45", subj: "Математика" },
      { n: 3, time: "10:00–10:45", subj: "Русский язык" },
      { n: 4, time: "10:55–11:40", subj: "Изобразительное искусство" },
    ]
  },
  {
    name: "Суббота", short: "СБ",
    lessons: []
  },
  {
    name: "Воскресенье", short: "ВС",
    lessons: []
  }
];

let currentDayIdx = -1;
let touchStartX = 0;
let touchStartY = 0;

function getWeekSeed() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const week = Math.floor(((now - start) / 86400000 + start.getDay() + 1) / 7);
  return week;
}

function getDaySeed() {
  const now = new Date();
  return now.getFullYear() * 1000 + now.getMonth() * 50 + now.getDate();
}

function getWeekendMessage(dayIdx) {
  const seed = getDaySeed();
  const msgs = dayIdx === 5 ? SAT_MESSAGES : SUN_MESSAGES;
  return msgs[seed % msgs.length];
}

function parseTime(t) {
  const [h, m] = t.split("–")[0].split(":").map(Number);
  return h * 60 + m;
}

function getTodayIndex() {
  const d = new Date().getDay();
  return d === 0 ? 6 : d - 1;
}

function getCurrentLesson(day) {
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  for (let i = 0; i < day.lessons.length; i++) {
    const s = parseTime(day.lessons[i].time);
    const end = s + 45;
    if (cur >= s && cur < end) return { idx: i, type: "current" };
    if (cur < s) return { idx: i, type: "next" };
  }
  if (day.lessons.length && cur >= parseTime(day.lessons[day.lessons.length - 1].time) + 45) {
    return { idx: day.lessons.length - 1, type: "past" };
  }
  return null;
}

function countdown(targetMin) {
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  const diff = targetMin - cur;
  if (diff <= 0) return "";
  const h = Math.floor(diff / 60);
  const m = diff % 60;
  if (h > 0) return `через ${h} ч ${m} мин`;
  return `через ${m} мин`;
}

function renderLesson(l, state) {
  const cls = state === "current" ? " current" : state === "past" ? " past" : "";
  const startMin = parseTime(l.time);
  const cd = state === "next" ? countdown(startMin) : "";
  return `
    <div class="lesson${cls}">
      <div class="lesson-body">
        <div class="lesson-num">${l.n}</div>
        <div class="lesson-info">
          <div class="lesson-time">${l.time}</div>
          <div class="lesson-subject">${l.subj}</div>
          ${cd ? `<div class="lesson-countdown">${cd}</div>` : ""}
        </div>
      </div>
    </div>`;
}

function renderWeekendMsg(dayIdx) {
  const msg = getWeekendMessage(dayIdx);
  const animCls = msg.anim ? ` animate-${msg.anim}` : "";
  return `
    <div class="weekend-msg${animCls}">
      <span class="emoji">${msg.emoji}</span>
      ${msg.text}
      <div class="sub">${dayIdx === 5 ? "Суббота" : "Воскресенье"}</div>
    </div>`;
}

function renderStatus() {
  const el = document.getElementById("status");
  const today = getTodayIndex();
  const day = SCHEDULE[today];
  const info = getCurrentLesson(day);
  const now = new Date();
  const timeStr = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

  if (day.lessons.length === 0) {
    const msg = getWeekendMessage(today);
    const tip = today === 5
      ? "Отдыхай — ты заслужил!"
      : "Завтра школа — подготовь рюкзак!";
    el.innerHTML = `${msg.emoji} ${msg.text}<br><span style="font-size:12px;color:var(--muted)">${tip}</span>`;
    return;
  }
  if (!info) {
    el.innerHTML = `${day.name} · ${timeStr} · Уроков больше нет`;
    return;
  }
  const l = day.lessons[info.idx];
  if (info.type === "current") {
    el.innerHTML = `Сейчас: <span class="highlight">${l.subj}</span> · ${l.time} · ${timeStr}`;
  } else if (info.type === "next") {
    el.innerHTML = `Следующий: <span class="highlight">${l.subj}</span> · ${l.time} · ${countdown(parseTime(l.time))}`;
  } else {
    el.innerHTML = `${day.name} · ${timeStr} · Уроков больше нет`;
  }
}

function renderProgress() {
  const today = getTodayIndex();
  const day = SCHEDULE[today];
  if (!day.lessons.length) {
    document.getElementById("progressFill").style.width = "0%";
    return;
  }
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  const first = parseTime(day.lessons[0].time);
  const last = parseTime(day.lessons[day.lessons.length - 1].time) + 45;
  const pct = Math.max(0, Math.min(100, ((cur - first) / (last - first)) * 100));
  document.getElementById("progressFill").style.width = pct + "%";
}

function renderTabs() {
  const wrap = document.getElementById("dayTabs");
  const today = getTodayIndex();
  wrap.innerHTML = SCHEDULE.map((d, i) => {
    const cls = i === today ? " active today" : "";
    return `<div class="day-tab${cls}" data-day="${i}" onclick="switchDay(${i})">${d.short}</div>`;
  }).join("");
}

function switchDay(idx) {
  if (idx < 0 || idx >= SCHEDULE.length) return;
  currentDayIdx = idx;
  document.querySelectorAll(".day-tab").forEach((t, i) => {
    t.classList.toggle("active", i === idx);
  });
  document.querySelectorAll(".day-panel").forEach((p, i) => {
    p.classList.toggle("active", i === idx);
  });
}

function handleSwipe() {
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) < 50) return;
  if (diff > 0) {
    switchDay(Math.min(currentDayIdx + 1, SCHEDULE.length - 1));
  } else {
    switchDay(Math.max(currentDayIdx - 1, 0));
  }
}

document.addEventListener("touchstart", (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", (e) => {
  const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
  const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
  if (dx > dy && dx > 50) {
    handleSwipe();
  }
}, { passive: true });

function renderAll() {
  const today = getTodayIndex();
  const content = document.getElementById("dayContent");
  const isMobile = window.innerWidth < 768;

  if (isMobile) {
    content.innerHTML = SCHEDULE.map((d, i) => {
      if (d.lessons.length === 0) {
        return `<div class="day-panel${i === today ? ' active' : ''}">${renderWeekendMsg(i)}</div>`;
      }
      const info = getCurrentLesson(d);
      const lessons = d.lessons.map((l, li) => {
        let st = "future";
        if (info) {
          if (li < info.idx) st = "past";
          else if (li === info.idx) st = info.type;
        }
        return renderLesson(l, st);
      }).join("");
      return `<div class="day-panel${i === today ? ' active' : ''}">${lessons}</div>`;
    }).join("");
  } else {
    const left = SCHEDULE.slice(0, 4);
    const right = SCHEDULE.slice(4);
    const renderSide = (days) => days.map(d => {
      if (d.lessons.length === 0) {
        return `
          <div class="diary-day">
            <div class="diary-day-name">${d.name}</div>
            ${renderWeekendMsg(SCHEDULE.indexOf(d))}
          </div>`;
      }
      const info = getCurrentLesson(d);
      const lessons = d.lessons.map((l, li) => {
        let st = "future";
        if (info) {
          if (li < info.idx) st = "past";
          else if (li === info.idx) st = info.type;
        }
        return renderLesson(l, st);
      }).join("");
      return `
        <div class="diary-day">
          <div class="diary-day-name">${d.name}</div>
          ${lessons}
        </div>`;
    }).join("");
    content.innerHTML = `
      <div class="diary">
        <div class="diary-side">${renderSide(left)}</div>
        <div class="diary-side">${renderSide(right)}</div>
      </div>`;
  }
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  const btn = document.querySelector(".theme-btn");
  btn.textContent = document.body.classList.contains("dark") ? "☾" : "☀";
  localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
}

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  document.querySelector(".theme-btn").textContent = "☾";
}

currentDayIdx = getTodayIndex();
renderTabs();
renderAll();
renderStatus();
renderProgress();

setInterval(() => { renderStatus(); renderProgress(); }, 30000);
window.addEventListener("resize", renderAll);
</script>
</body>
</html>
