<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Расписание 2А · 2026–2027</title>
<meta property="og:title" content="Расписание 2А · 2026–2027">
<meta property="og:description" content="Расписание уроков 2 «А» класс · ауд. 1-3 · Беларусь">
<meta property="og:type" content="website">
<meta property="og:image" content="https://vividlyvividlife.github.io/schedule/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Расписание 2А · 2026–2027">
<meta name="twitter:description" content="Расписание уроков 2 «А» класс · ауд. 1-3">
<meta name="twitter:image" content="https://vividlyvividlife.github.io/schedule/og-image.png">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<div class="header">
  <div>
    <h1>Расписание 2026–2027</h1>
    <div class="sub">2 «А» · ауд. 1-3</div>
    <div class="date" id="dateDisplay" data-clock></div>
    <div style="margin-top:4px;display:flex;align-items:center;gap:8px;">
      <a href="https://vividlyvividlife.github.io/schedule/zayavlenie.html" target="_blank" style="font-size:12px;color:var(--accent);text-decoration:none;">Заявление директору →</a>
      <button onclick="navigator.clipboard.writeText('https://vividlyvividlife.github.io/schedule/zayavlenie.html').then(()=>this.textContent='✓')" style="font-size:11px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:2px 6px;cursor:pointer;">🔗 Копировать</button>
    </div>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="Тёмная тема">☀</button>
</div>

<div class="toggles" id="togglesContainer"></div>

<div class="status" id="status"></div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<div class="countdowns" id="countdowns"></div>

<div class="day-tabs" id="dayTabs"></div>

<div class="day-content" id="dayContent"></div>

<div class="edit-bar" id="editBar" style="display:none;">
  <button class="add-btn" id="addBtn" onclick="showAddModal()" style="display:none;">+ Добавить урок</button>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Редактировать</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <label class="modal-label">День
        <select class="modal-input" id="modalDay"></select>
      </label>
      <label class="modal-label">Номер урока
        <input class="modal-input" id="modalNum" type="number" min="1" max="11">
      </label>
      <label class="modal-label">Предмет
        <input class="modal-input" id="modalSubj" placeholder="Математика" autocomplete="off">
      </label>
      <label class="modal-label">Время
        <input class="modal-input" id="modalTime" placeholder="08:30–09:15">
      </label>
      <label class="modal-label">Кабинет
        <input class="modal-input" id="modalRoom" placeholder="ауд. 1-3" autocomplete="off">
      </label>
      <label class="modal-label">Место
        <input class="modal-input" id="modalLocation" placeholder="2 этаж, корп. А" autocomplete="off">
      </label>
      <label class="modal-label">Преподаватель / Тренер
        <input class="modal-input" id="modalTeacher" placeholder="Иванова И.И." autocomplete="off">
      </label>
      <label class="modal-label">Тип
        <input class="modal-input" id="modalType" value="Урок" autocomplete="off">
      </label>
      <label class="modal-label">Цвет карточки
        <div class="color-picker" id="modalColorPicker"></div>
      </label>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="modal-btn modal-btn-delete" id="modalDeleteBtn" onclick="deleteFromModal()" style="display:none;background:#d45555;color:#fff;">Удалить</button>
      <button class="modal-btn modal-btn-save" onclick="saveModal()">Сохранить</button>
    </div>
  </div>
</div>

<script src="engines.js?v=5"></script>
<script src="script.js?v=5"></script>
</body>
</html>
